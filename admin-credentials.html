<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Change Admin Credentials | Aman Jain Portfolio</title>
  <meta name="description" content="Update private Admin Username and Password credentials." />

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Three.js 3D WebGL Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- Core Design System CSS -->
  <link rel="stylesheet" href="style.css?v=200000" />

  <!-- Auth Guard -->
  <script>
    if (sessionStorage.getItem('aman_admin_auth') !== 'true') {
      window.location.href = 'admin-login.html';
    }
  </script>
</head>
<body class="dark-theme">

  <!-- Interactive Three.js WebGL Canvas -->
  <canvas id="heroCanvas"></canvas>

  <!-- Custom Cursor Ring -->
  <div class="cursor-dot" id="cursorDot"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <!-- Navigation Header -->
  <header class="navbar" id="navbar">
    <div class="nav-container">
      <a href="/" class="logo">
        <span class="logo-accent">&lt;</span>AMAN<span class="logo-accent">/&gt;</span>
      </a>

      <nav class="nav-links" id="navLinks">
        <a href="/" class="nav-link">Home</a>
        <a href="about" class="nav-link">About</a>
        <a href="projects" class="nav-link">Projects</a>
        <a href="socials" class="nav-link">Socials & Contact</a>
      </nav>

      <div class="nav-actions" style="display: flex; align-items: center; gap: 14px;">
        <a href="admin-dashboard.html" class="btn btn-outline" title="Return to Admin Dashboard">
          <i class="fa-solid fa-gauge-high"></i>
          <span>Dashboard</span>
        </a>

        <a href="admin-login.html" class="btn btn-primary" onclick="sessionStorage.removeItem('aman_admin_auth');" title="Logout Session">
          <i class="fa-solid fa-right-from-bracket"></i>
          <span>Logout</span>
        </a>
      </div>
    </div>
  </header>

  <main style="padding-top: 130px; min-height: 80vh; display: flex; align-items: center; justify-content: center;">
    <div class="container" style="max-width: 480px;">
      <div class="admin-login-card glass-panel center" style="padding: 42px 36px; box-shadow: 0 20px 50px rgba(0,0,0,0.8);">
        <div class="lock-icon-badge" style="width: 64px; height: 64px; border-radius: 50%; background: rgba(255,255,255,0.08); border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6rem; color: #ffffff;">
          <i class="fa-solid fa-user-shield"></i>
        </div>

        <span class="section-tag" style="letter-spacing: 0.15em;">// SECURITY CREDENTIALS</span>
        <h2 class="section-title" style="font-size: 1.85rem; margin-bottom: 8px;">Change Passcode & User</h2>
        <p class="section-desc" style="font-size: 0.88rem; margin-bottom: 26px;">Update your private Admin Username and Secret Password.</p>

        <form id="credentialsForm" onsubmit="window.handleCredentialsUpdate(event); return false;">
          <div class="form-group" style="text-align: left; margin-bottom: 18px;">
            <label for="newAdminUser" style="font-size: 0.82rem; font-family: var(--font-code); color: var(--text-muted); display: block; margin-bottom: 6px;">New Admin Username *</label>
            <input type="text" id="newAdminUser" placeholder="Enter new username" required style="width: 100%; padding: 12px 14px; background: rgba(0,0,0,0.6); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: #ffffff; font-family: var(--font-code); font-size: 0.92rem;" />
          </div>

          <div class="form-group" style="text-align: left; margin-bottom: 18px;">
            <label for="newAdminPass" style="font-size: 0.82rem; font-family: var(--font-code); color: var(--text-muted); display: block; margin-bottom: 6px;">New Secret Password *</label>
            <input type="password" id="newAdminPass" placeholder="Enter new secret password" required style="width: 100%; padding: 12px 14px; background: rgba(0,0,0,0.6); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: #ffffff; font-family: var(--font-code); font-size: 0.92rem;" />
          </div>

          <div class="form-group" style="text-align: left; margin-bottom: 26px;">
            <label for="confirmAdminPass" style="font-size: 0.82rem; font-family: var(--font-code); color: var(--text-muted); display: block; margin-bottom: 6px;">Confirm New Password *</label>
            <input type="password" id="confirmAdminPass" placeholder="Re-type new secret password" required style="width: 100%; padding: 12px 14px; background: rgba(0,0,0,0.6); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: #ffffff; font-family: var(--font-code); font-size: 0.92rem;" />
          </div>

          <div style="display: flex; gap: 12px;">
            <button type="submit" class="btn btn-primary" style="flex: 1; justify-content: center; padding: 14px;">
              <i class="fa-solid fa-floppy-disk"></i>
              <span>Save Credentials</span>
            </button>
            <a href="admin-dashboard.html" class="btn btn-outline" style="padding: 14px 18px;">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer" style="margin-top: 60px;">
    <div class="container footer-content">
      <div class="footer-left">
        <a href="index.html" class="logo">
          <span class="logo-accent">&lt;</span>AMAN<span class="logo-accent">/&gt;</span>
        </a>
        <p>&copy; 2026 Aman Jain. Pure Black & White Hyperspace Architecture.</p>
      </div>

      <div class="footer-right">
        <a href="admin-dashboard.html" class="admin-cms-link" style="color: var(--text-muted); font-size: 0.85rem; text-decoration: none;">
          <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
        </a>
      </div>
    </div>
  </footer>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Security & Firebase SDKs -->
  <script src="security.js?v=200000"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js?v=200000"></script>

  <!-- JavaScript -->
  <script src="app.js?v=200000"></script>

  <!-- Update Script -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem('aman_admin_credentials_v1');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (parsed.user) document.getElementById('newAdminUser').value = parsed.user;
        } catch(e) {}
      } else {
        document.getElementById('newAdminUser').value = 'admin';
      }
    });

    window.handleCredentialsUpdate = async function(e) {
      if (e) e.preventDefault();
      const newUsr = window.sanitizeInput(document.getElementById('newAdminUser').value);
      const newPass = document.getElementById('newAdminPass').value.trim();
      const confirmPass = document.getElementById('confirmAdminPass').value.trim();

      if (!newUsr || !newPass) {
        alert('Please fill in both Username and Password.');
        return;
      }

      if (newPass !== confirmPass) {
        alert('New Password and Confirm Password do not match.');
        return;
      }

      const passHash = await window.hashSHA256(newPass);
      const newCreds = { user: newUsr, passHash: passHash, updatedAt: new Date().toISOString() };
      localStorage.setItem('aman_admin_credentials_v1', JSON.stringify(newCreds));

      // Sync to Firebase Cloud Firestore if connected
      if (typeof db !== 'undefined' && db) {
        try {
          await db.collection('settings').doc('admin_auth').set(newCreds);
          console.log("🔥 Admin credentials (SHA-256 Hashed) synced to Firebase Cloud Firestore!");
        } catch(err) {
          console.warn("Firestore auth sync error:", err);
        }
      }

      if (typeof showToast === 'function') showToast(`Credentials updated! New Username: "${newUsr}"`);
      setTimeout(() => {
        window.location.href = 'admin-dashboard.html';
      }, 500);
    };
  </script>
</body>
</html>
